{#
  Generic confirmation modal. Any button can drive it:

    <button data-confirm-form="#delete-form-4"
            data-confirm-title="Delete doctor?"
            data-confirm-text="This cannot be undone."
            data-confirm-button="Delete"
            data-confirm-tone="danger">Delete</button>

  The form it points at posts with its own CSRF token, so the action stays
  protected even though the modal is the visible trigger.
#}
<div class="modal fade" id="confirmActionModal" tabindex="-1" aria-labelledby="confirmActionTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="confirmActionTitle">Are you sure?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="confirmActionText">This action cannot be undone.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-hms" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmActionSubmit">Confirm</button>
      </div>
    </div>
  </div>
</div>
